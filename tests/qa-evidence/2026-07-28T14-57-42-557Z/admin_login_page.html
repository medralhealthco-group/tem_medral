<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal Login | Medral Health Co</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="/assets/css/fonts.css" rel="stylesheet" />
    <link href="/assets/css/admin-base.css" rel="stylesheet" />
    <link rel="icon" href="/assets/images/faviconn.png" type="image/png" />
  </head>
  <body data-theme="admin" class="admin-login-body">
    <div class="admin-login-card">
      <div class="admin-brand">
        <img src="/assets/images/medrallogo.png" alt="Medral Health" />
        <h1 class="admin-title">Store Administration</h1>
        <p class="admin-subtitle">Secure Staff Portal</p>
      </div>

      

      <form action="/admin/login" method="POST">
        <input type="hidden" name="_csrf" value="73e074ebe13260bfc35493ff0bcddc92220c1dc312f31aa61c99855d4a571aa9">
        <div class="admin-group">
          <label for="email" class="admin-label">Admin Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="admin-input"
            value=""
            placeholder="admin@medralhealth.com"
            required
            autofocus
          />
        </div>

        <div class="admin-group">
          <label for="password" class="admin-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="admin-input"
            placeholder="••••••••••••"
            required
          />
        </div>

        <button type="submit" class="admin-btn">Authenticate & Access</button>
      </form>
    </div>
  </body>
</html>
